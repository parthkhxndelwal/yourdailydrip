name: tmp-set-secret (RAZORPAY_KEY_ID + www diagnosis)

# TEMPORARY one-shot workflow (manual dispatch only).
# Purpose:
#   1. Set the live RAZORPAY_KEY_ID worker secret on yourdailydrip-storefront
#      (wrangler needs CLOUDFLARE_API_TOKEN, which exists only as a repo secret).
#   2. Verify it via `wrangler secret list`.
#   3. Diagnose www.yourdailydrip.com: worker custom domains + zone DNS records.
# This file is deleted after the run.

on:
  workflow_dispatch:

jobs:
  set-secret-and-diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set RAZORPAY_KEY_ID worker secret
        working-directory: storefront
        run: printf '%s' "rzp_live_TKyZpQb9rjHZi2" | npx wrangler secret put RAZORPAY_KEY_ID --name yourdailydrip-storefront

      - name: List worker secrets (verify RAZORPAY_KEY_ID present)
        working-directory: storefront
        run: npx wrangler secret list --name yourdailydrip-storefront

      - name: List worker custom domains (diagnose www.yourdailydrip.com)
        run: |
          curl -s \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"

      - name: Zone DNS records for www.yourdailydrip.com
        run: |
          ZONE_JSON=$(curl -s \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=yourdailydrip.com")
          echo "=== zones?name=yourdailydrip.com ==="
          echo "$ZONE_JSON"
          ZONE_ID=$(printf '%s' "$ZONE_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")
          echo "ZONE_ID=$ZONE_ID"
          if [ -n "$ZONE_ID" ]; then
            echo "=== dns_records?name=www.yourdailydrip.com ==="
            curl -s \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=www.yourdailydrip.com"
          else
            echo "No zone found for yourdailydrip.com — cannot list DNS records."
          fi
