name: Deploy Storefront (Cloudflare Workers)

# Runs on every push to main (i.e. every merged PR), scoped to storefront changes.
# Builds with bun + Nitro and deploys the Workers service (yourdailydrip-storefront).
# Skips (job is skipped, not failed) until CLOUDFLARE_API_TOKEN is set in repo secrets.

on:
  push:
    branches: [main]
    paths:
      - "storefront/**"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:

concurrency:
  group: deploy-storefront
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: storefront
        run: bun install --frozen-lockfile

      - name: Build (Nitro cloudflare-module)
        working-directory: storefront
        env:
          # Public client config baked into the browser bundle at build time.
          # These are PUBLIC (see storefront/.env.example), NOT backend secrets.
          VITE_MEDUSA_BACKEND_URL: https://api.yourdailydrip.com
          VITE_MEDUSA_PUBLISHABLE_KEY: pk_03c87a2a2bb94fc7817544f7a44ace3f4dd63b4548fd79030cbcf70bc4a3b189
          VITE_RAZORPAY_KEY_ID: rzp_live_TKyZpQb9rjHZi2
        run: bun run build

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: storefront
        run: npx wrangler deploy
